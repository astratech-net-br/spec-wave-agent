name: PR Events

# Recebe, de um repositório de CÓDIGO do mesmo Project, o aviso de que um PR
# foi aberto, aprovado ou mergeado lá (RFC-005 §7.1). O despachante de lá
# manda um repository_dispatch com { event, pr_repo, pr_number }; tudo que
# toca o board roda AQUI, no hub, dentro do namespace spec-wave-item-<feature>
# que serializa com o decompose. Num hub sem repos de código este workflow
# nunca dispara e não custa nada.
#
# Tokens: GITHUB_TOKEN só enxerga este repositório, e o PR está noutro. Por
# isso a CLI recebe um token que atravessa repositórios também como
# GITHUB_TOKEN — o da GitHub App da organização (SPEC_WAVE_APP_ID +
# SPEC_WAVE_APP_PRIVATE_KEY), quando configurada, senão o GH_PROJECT_TOKEN
# (PAT com repo + project). Sem nenhum dos dois, cai no GITHUB_TOKEN, que
# ainda lê PR de repo público mas não comenta.
on:
  repository_dispatch:
    types: [spec-wave-pr]

# Trava por PR de origem: o mesmo PR do mesmo repo não é processado duas
# vezes ao mesmo tempo. A trava que importa é a do job `move`, por ITEM.
concurrency:
  group: spec-wave-pr-${{ github.event.client_payload.pr_repo }}-${{ github.event.client_payload.pr_number }}
  cancel-in-progress: false

# `secrets` não entra em `if`; a presença da GitHub App vira env.
env:
  SPEC_WAVE_APP_PRESENT: ${{ secrets.SPEC_WAVE_APP_PRIVATE_KEY != '' }}

jobs:
  # Descobre a Feature-alvo ANTES de tocar no board, para dar a chave de
  # concurrency ao job seguinte — mesmo desenho do code-review.yml local.
  resolve:
    # Modo de execução: `spec-wave mode local` cria a variável de repositório
    # SPEC_WAVE_EXECUTION=local e este job passa a ser PULADO.
    if: vars.SPEC_WAVE_EXECUTION != 'local' && github.event.client_payload.event == 'opened'
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: read
      contents: read
    outputs:
      feature: ${{ steps.resolve.outputs.feature }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Instala a CLI
        run: npm install -g @spec-wave/cli@1.7.0

      - id: app
        if: env.SPEC_WAVE_APP_PRESENT == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SPEC_WAVE_APP_ID }}
          private-key: ${{ secrets.SPEC_WAVE_APP_PRIVATE_KEY }}

      - id: resolve
        run: >
          spec-wave code-review
          --pr-number ${{ github.event.client_payload.pr_number }}
          --pr-repo ${{ github.event.client_payload.pr_repo }}
          --resolve-only
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || secrets.GH_PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

  move:
    needs: resolve
    if: >
      vars.SPEC_WAVE_EXECUTION != 'local' &&
      needs.resolve.outputs.feature != ''
    runs-on: ubuntu-latest
    # MESMO namespace do decompose.yml e do code-review.yml: um decompose-apply
    # em curso na Feature segura este job na fila em vez de disputar a
    # subárvore com ele.
    concurrency:
      group: spec-wave-item-${{ needs.resolve.outputs.feature }}
      cancel-in-progress: false
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Instala a CLI
        run: npm install -g @spec-wave/cli@1.7.0

      - id: app
        if: env.SPEC_WAVE_APP_PRESENT == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SPEC_WAVE_APP_ID }}
          private-key: ${{ secrets.SPEC_WAVE_APP_PRIVATE_KEY }}

      - name: Move Feature to Code Review
        run: >
          spec-wave code-review
          --pr-number ${{ github.event.client_payload.pr_number }}
          --pr-repo ${{ github.event.client_payload.pr_repo }}
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || secrets.GH_PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
          PROJECT_TOKEN: ${{ steps.app.outputs.token || secrets.GH_PROJECT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

  qa:
    if: vars.SPEC_WAVE_EXECUTION != 'local' && github.event.client_payload.event == 'qa'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Instala a CLI
        run: npm install -g @spec-wave/cli@1.7.0

      - id: app
        if: env.SPEC_WAVE_APP_PRESENT == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SPEC_WAVE_APP_ID }}
          private-key: ${{ secrets.SPEC_WAVE_APP_PRIVATE_KEY }}

      - name: Move Feature to QA
        run: >
          spec-wave qa
          --pr-number ${{ github.event.client_payload.pr_number }}
          --pr-repo ${{ github.event.client_payload.pr_repo }}
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || secrets.GH_PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
          PROJECT_TOKEN: ${{ steps.app.outputs.token || secrets.GH_PROJECT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
