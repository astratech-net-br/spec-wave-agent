name: release

# Publica os binários do agente ao empurrar uma tag vX.Y.Z.
# O `spec-wave dev-agent --install` baixa esses assets com `gh release download`.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag existente para (re)publicar os binários'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cria a release (idempotente)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          # Windows 10/11 x64 (não existe label "windows-11" para x64;
          # windows-latest gera binário que roda nos dois).
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          # Mac Intel (x86_64-apple-darwin) fora: runners macos-13 estão em
          # desativação e ficam presos na fila. Quem usar Mac Intel compila do
          # fonte (make build) — ou reative cross-compilando no macos-14.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain Rust
        run: rustup target add ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Empacota (binário cru + sha256)
        shell: bash
        run: |
          asset="spec-wave-agent-${{ matrix.target }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/spec-wave-agent${{ matrix.ext }}" "$asset"
          # macOS tem shasum; Git Bash (Windows) e Linux têm sha256sum.
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$asset" > "$asset.sha256"
          else
            sha256sum "$asset" > "$asset.sha256"
          fi
          ls -lh "$asset"

      - name: Publica na release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="spec-wave-agent-${{ matrix.target }}${{ matrix.ext }}"
          gh release upload "$TAG" "$asset" "$asset.sha256" --clobber
