name: release

# Publica os binários do agente ao empurrar uma tag vX.Y.Z.
# O `spec-wave dev-agent --install` baixa esses assets com `gh release download`.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag existente para (re)publicar os binários'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cria a release (idempotente)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain Rust
        run: rustup target add ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Empacota (binário cru + sha256)
        run: |
          asset="spec-wave-agent-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/spec-wave-agent" "$asset"
          shasum -a 256 "$asset" > "$asset.sha256"
          ls -lh "$asset"

      - name: Publica na release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="spec-wave-agent-${{ matrix.target }}"
          gh release upload "$TAG" "$asset" "$asset.sha256" --clobber
