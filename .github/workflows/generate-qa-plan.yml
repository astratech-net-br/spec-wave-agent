name: Generate QA Plan

on:
  issues:
    types: [labeled]

# Mesmo desenho do decompose.yml: `labeled` dispara para QUALQUER label, então o
# run que não vai fazer nada ganha um grupo único (`spec-wave-noop-<run_id>`) e
# não disputa a fila — com `cancel-in-progress: false`, um run inútil na fila
# cancelaria o que estava PENDENTE (ver o comentário longo no decompose.yml).
#
# O namespace `spec-wave-item-<issue>` é COMPARTILHADO com decompose.yml,
# generate-spec/plan/bug e o job `move` do code-review.yml: este workflow também
# publica documento em branch própria + Pull Request, e lê spec.md/plan.md que
# uma geração concorrente estaria trocando.
concurrency:
  group: >-
    ${{ github.event.label.name == 'spec-wave:qa'
    && format('spec-wave-item-{0}', github.event.issue.number)
    || format('spec-wave-noop-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  generate-qa-plan:
    # `spec-wave:qa` numa Feature gera (ou re-critica) o qa-plan.md. O comando
    # trata sozinho os outros tipos (Story → aponta a Feature-pai; Bug → usa o
    # Teste de Regressão do bug.md), então o filtro de título fica amplo de
    # propósito — o `if:` só corta o ruído de labels sem relação.
    # Modo de execução: `spec-wave mode local` cria a variável de repositório
    # SPEC_WAVE_EXECUTION=local e este job passa a ser PULADO.
    if: >
      vars.SPEC_WAVE_EXECUTION != 'local' &&
      github.event.label.name == 'spec-wave:qa'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      # O commit do qa-plan.md vai por Git Data API (contents: write) para uma
      # branch própria (`spec-wave/<n>-qa-plan`), nunca a default; sem
      # `pull-requests: write` o commit existe e o PR não.
      contents: write
      pull-requests: write
    # `secrets` não entra em `if`; a presença da GitHub App vira env do job.
    env:
      SPEC_WAVE_APP_PRESENT: ${{ secrets.SPEC_WAVE_APP_PRIVATE_KEY != '' }}

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Instala a CLI
        run: npm install -g @spec-wave/cli@1.7.0

      # Token de GitHub App da organização, quando configurada
      # (SPEC_WAVE_APP_ID + SPEC_WAVE_APP_PRIVATE_KEY): substitui os PATs
      # pessoais — quem sai da org não derruba o fluxo. Sem os secrets o step
      # é pulado, `steps.app.outputs.token` fica vazio e os PATs continuam
      # valendo pelo `||` abaixo.
      - id: app
        if: env.SPEC_WAVE_APP_PRESENT == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SPEC_WAVE_APP_ID }}
          private-key: ${{ secrets.SPEC_WAVE_APP_PRIVATE_KEY }}

      # Multi-repo (RFC-005 §7.2): clona em .spec-wave/repos/<slug>/ os repos
      # de código que a issue declara (labels repo:<slug>; a Feature agrega as
      # Stories), para o modelo ler CÓDIGO e não só o markdown do hub. Sem repo
      # declarado só avisa. O GITHUB_TOKEN só enxerga este repositório — para
      # clonar os outros vai o GH_PROJECT_TOKEN, quando existir.
      - name: Monta o workspace multi-repo
        run: spec-wave workspace prepare --issue ${{ github.event.issue.number }}
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token || secrets.GH_PROJECT_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Generate QA plan
        run: spec-wave generate-qa-plan --issue-number ${{ github.event.issue.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PR_TOKEN: ${{ steps.app.outputs.token || secrets.GH_PR_TOKEN }}
          PROJECT_TOKEN: ${{ steps.app.outputs.token || secrets.GH_PROJECT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
