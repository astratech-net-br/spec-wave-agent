name: Code Review

# Repositório de CÓDIGO (RFC-005 §7.1): este workflow não roda a CLI nem toca
# no board. Ele só avisa o hub — onde vivem as issues e o GitHub Project — que
# um PR foi aberto aqui. O hub recebe o aviso em pr-events.yml e faz o resto,
# dentro da trava por item que o serializa com o decompose. `concurrency` do
# GitHub é por repositório: com N repos de código, só centralizar no hub
# devolve a serialização.
#
# O hub é lido do .spec-wave.json deste repositório em tempo de execução, e
# NÃO carimbado no YAML: o `update` compara este arquivo byte a byte com o
# template empacotado, e um hub embutido o marcaria como desatualizado para
# sempre.
#
# Token para despachar (o repository_dispatch exige escrita em Contents NO
# HUB; o GITHUB_TOKEN só enxerga este repositório): a GitHub App da
# organização (SPEC_WAVE_APP_ID + SPEC_WAVE_APP_PRIVATE_KEY, instalada nos
# dois repos) emite um token restrito ao hub; sem ela, o secret
# SPEC_WAVE_HUB_TOKEN (PAT) continua valendo.
on:
  pull_request:
    types: [opened, reopened]

concurrency:
  group: spec-wave-dispatch-${{ github.event.pull_request.number }}
  cancel-in-progress: false

# `secrets` não entra em `if`; a presença da GitHub App vira env.
env:
  SPEC_WAVE_APP_PRESENT: ${{ secrets.SPEC_WAVE_APP_PRIVATE_KEY != '' }}

jobs:
  dispatch:
    # PR de documento (`spec-wave/*`) não é PR de implementação.
    if: "!startsWith(github.event.pull_request.head.ref, 'spec-wave/')"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - id: hub
        name: Lê o hub do .spec-wave.json
        run: |
          owner="$(jq -r '.hub.owner // ""' .spec-wave.json)"
          name="$(jq -r '.hub.repo // ""' .spec-wave.json)"
          if [ -z "$owner" ] || [ -z "$name" ]; then
            echo "::error::.spec-wave.json sem hub {owner, repo}. Rode: npx @spec-wave/cli@1.7.0 init --role code --repo ${{ github.repository }} --hub <owner/repo>"
            exit 1
          fi
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "repo=$owner/$name" >> "$GITHUB_OUTPUT"

      - id: app
        if: env.SPEC_WAVE_APP_PRESENT == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SPEC_WAVE_APP_ID }}
          private-key: ${{ secrets.SPEC_WAVE_APP_PRIVATE_KEY }}
          owner: ${{ steps.hub.outputs.owner }}
          repositories: ${{ steps.hub.outputs.name }}

      - name: Avisa o hub (repository_dispatch)
        run: |
          gh api "repos/${{ steps.hub.outputs.repo }}/dispatches" --input - <<'PAYLOAD'
          {
            "event_type": "spec-wave-pr",
            "client_payload": {
              "event": "opened",
              "pr_repo": "${{ github.repository }}",
              "pr_number": ${{ github.event.pull_request.number }}
            }
          }
          PAYLOAD
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.SPEC_WAVE_HUB_TOKEN }}
