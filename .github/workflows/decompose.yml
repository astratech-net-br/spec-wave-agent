name: Decompose Feature

on:
  issues:
    types: [labeled]

# O evento `labeled` pode redisparar (re-add da label, retry de runner). O
# concurrency serializa runs da mesma issue — inclusive um `decompose-apply`
# enfileirado atrás de um `decompose` — e o guard de idempotência
# (label spec-wave:decomposed) descarta o run enfileirado.
concurrency:
  group: spec-wave-decompose-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  decompose:
    # Duas etapas, duas labels:
    #  • spec-wave:decompose       → grava/re-critica docs/**/decomposition.md
    #  • spec-wave:decompose-apply → cria as Stories/Tasks a partir do rascunho
    # O `[RFC]` no título também dispara: o caminho RFC → Tasks existe na CLI
    # desde sempre, mas era inalcançável porque o filtro exigia `[FEATURE]`.
    if: >
      (github.event.label.name == 'spec-wave:decompose' ||
       github.event.label.name == 'spec-wave:decompose-apply') &&
      (contains(github.event.issue.title, '[FEATURE]') ||
       contains(github.event.issue.title, '[RFC]'))
    runs-on: ubuntu-latest
    permissions:
      issues: write
      # A etapa de rascunho commita docs/**/decomposition.md no branch default.
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Decompose into Stories and Tasks
        run: >
          npx @spec-wave/cli@0.16.4 decompose
          --issue-number ${{ github.event.issue.number }}
          ${{ github.event.label.name == 'spec-wave:decompose-apply' && '--apply' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_TOKEN: ${{ secrets.GH_PROJECT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
