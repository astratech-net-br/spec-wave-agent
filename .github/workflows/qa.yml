name: QA

# Repositório de CÓDIGO (RFC-005 §7.3): despachante fino, sem CLI e sem board.
# Aprovação formal OU merge do PR viram um aviso ao hub, que move a Feature
# para 🧪 QA em pr-events.yml. Sem este arquivo nada chega a QA — os eventos
# de review e de merge acontecem SÓ aqui, no repo do PR.
#
# O hub é lido do .spec-wave.json em tempo de execução (ver code-review.yml,
# que explica por que o YAML não pode carimbá-lo). Token para despachar: a
# GitHub App da organização (SPEC_WAVE_APP_ID + SPEC_WAVE_APP_PRIVATE_KEY),
# quando configurada; senão o secret SPEC_WAVE_HUB_TOKEN (PAT com escrita em
# Contents no hub).
on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [closed]

concurrency:
  group: spec-wave-dispatch-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: false

# `secrets` não entra em `if`; a presença da GitHub App vira env.
env:
  SPEC_WAVE_APP_PRESENT: ${{ secrets.SPEC_WAVE_APP_PRIVATE_KEY != '' }}

jobs:
  dispatch:
    # PR de documento (`spec-wave/*`) não é PR de implementação, e aprovar o
    # PR da spec moveria a Feature para QA. A última linha aceita os dois
    # eventos: review aprovada, ou PR fechado COM merge (sem merge não conta).
    if: >
      !startsWith(github.event.pull_request.head.ref, 'spec-wave/') &&
      (github.event.review.state == 'approved' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - id: hub
        name: Lê o hub do .spec-wave.json
        run: |
          owner="$(jq -r '.hub.owner // ""' .spec-wave.json)"
          name="$(jq -r '.hub.repo // ""' .spec-wave.json)"
          if [ -z "$owner" ] || [ -z "$name" ]; then
            echo "::error::.spec-wave.json sem hub {owner, repo}. Rode: npx @spec-wave/cli@1.7.2 init --role code --repo ${{ github.repository }} --hub <owner/repo>"
            exit 1
          fi
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "repo=$owner/$name" >> "$GITHUB_OUTPUT"

      - id: app
        if: env.SPEC_WAVE_APP_PRESENT == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.SPEC_WAVE_APP_ID }}
          private-key: ${{ secrets.SPEC_WAVE_APP_PRIVATE_KEY }}
          owner: ${{ steps.hub.outputs.owner }}
          repositories: ${{ steps.hub.outputs.name }}

      - name: Avisa o hub (repository_dispatch)
        run: |
          gh api "repos/${{ steps.hub.outputs.repo }}/dispatches" --input - <<'PAYLOAD'
          {
            "event_type": "spec-wave-pr",
            "client_payload": {
              "event": "qa",
              "pr_repo": "${{ github.repository }}",
              "pr_number": ${{ github.event.pull_request.number }}
            }
          }
          PAYLOAD
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.SPEC_WAVE_HUB_TOKEN }}
